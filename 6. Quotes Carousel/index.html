<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under One Sky — Earth, Sky &amp; Universe Quotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="stars"></canvas>

<div class="wrap">
  <p class="eyebrow">Under one sky</p>
  <h1>Earth, sky &amp; the space between</h1>

  <div class="stage" id="stage" aria-roledescription="carousel" aria-label="Inspirational quotes about earth, sky and the universe">
    <!-- cards injected by JS -->
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="orbit" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
