<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Online at Zomato</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/cf73954ac0.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
    <div class="top">
    <div id="main">zomato</div>
    <div class="nav">
    <div class="dropdown">
        <i class='fas fa-map-marker-alt' style='font-size:20px;color:#fa6358'></i><!-- Represents a map marker icon -->
        <button class="dropbtn">Select Option</button>
        <div class="dropdown-content">
        <a href="#">Kakinada</a>
        <a href="#">Hyderabad</a>
        <a href="#">Vijayawada</a>
        <a href="#">Vizag</a>
        <a href="#">Rajamundry</a>
        </div>
        <i class="fa-solid fa-caret-down" style="font-size: 20px;color: rgb(107, 98, 98);"></i><!-- Represents a down-arrow emoji -->
    </div> | 
    
        <div class="search">
        <i class="fa-solid fa-magnifying-glass" style="font-size: 20px;color: grey;"></i><!-- Represents a magnifying glass emoji -->
        <div class="search-container">
        <input type="search" placeholder="Search for restaurant, cuisine or a dish">
        </div>
        </div>
    </div>
    <div class="cred">
        <div class="login"><a href="login.html">Login</a></div>
        <div class="sign-up"><a href="sign-up.html">Sign up</a></div>
    </div>
    </div></header>
    <nav>
    <div class="nav2">

    <div class="one">
       <button class="filter-btn"><i class="fa fa-sliders" style="font-size: 20px;color: grey;"></i> Filters</button>
    </div>

    <div class="two">
    <button class="pure-veg-btn">Pure Veg</button>
    </div>

    <div class="three">
    <select class="cuisine-select">
    <option>Cuisines</option>
    <!-- Add other options -->
    </select>
    </div>
    </div></nav>

    <div class="nav3">
    <div class="Choice">Inspiration for your first order</div>
    <div id="type">
        <div class="image">
            <button class="btn"><img src="files/Biryani1.png" alt="Biryani" class="circle-img">Biryani</button>
        </div>
        <div class="image">
            <button class="btn"><img src="files/Chicken.png" alt="Chicken" class="circle-img">Chicken</button>
        </div>
        <div class="image">
            <button class="btn"><img src="files/Fried Rice.png" alt="Fried Rice" class="circle-img">Fried Rice</button>
        </div>
        <div class="image">
            <button class="btn"><img src="files/Pizza.png" alt="Pizza" class="circle-img">Pizza</button>
        </div>
        <div class="image">
            <button class="btn"><img src="files/Thali.png" alt="Thali" class="circle-img">Thali</button>
        </div>
        <div class="image">
            <button class="btn"><img src="files/Burger.png" alt="Burger" class="circle-img">Burger</button>
        </div>
    </div>

    </div>
    
    
</body>
</html>
